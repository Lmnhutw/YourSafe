name: Publish YourSafe website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static website only
        run: |
          mkdir -p "$RUNNER_TEMP/passwordtool-site"
          cp website/home.html website/privacy-policy.html website/privacy.html website/styles.css website/navigation.js website/script.js website/analytics.js website/demo-login.html website/demo-login.js website/google481cfd7a3ecb26f2.html "$RUNNER_TEMP/passwordtool-site/"
          cp website/home.html "$RUNNER_TEMP/passwordtool-site/index.html"
          cp -R website/assets "$RUNNER_TEMP/passwordtool-site/assets"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/passwordtool-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
