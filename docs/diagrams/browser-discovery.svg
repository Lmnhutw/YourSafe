<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1134" width="820" height="1134" style="--border:#94a3b8;--bg:#ffffff;--fg:#1f2328;--line:#64748b;--accent:#0969da;--muted:#334155;background:var(--bg)"><title id="title">Discover accounts without releasing secrets</title><desc id="desc">The worker derives the active top-level document and checks desktop status before discovery. NativeHost validates protocol v3 and relays over a verified Windows pipe. Integration opt-in, an explicitly unlocked vault, origin policy and quotas gate metadata. The worker validates the response and rechecks its target before showing accounts.</desc><metadata>{&quot;source&quot;:&quot;browser-discovery.mmd&quot;,&quot;sourceSha256&quot;:&quot;9007d4f6f60986855ec91259f986a739a8f2859dd5ac81fa2134ad65dae49555&quot;,&quot;renderer&quot;:&quot;beautiful-mermaid@1.1.3&quot;,&quot;theme&quot;:&quot;github-light&quot;,&quot;line&quot;:&quot;#64748b&quot;,&quot;muted&quot;:&quot;#334155&quot;,&quot;border&quot;:&quot;#94a3b8&quot;}</metadata><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a"><text x="24" y="34" font-size="24" font-weight="600">Discover accounts without releasing secrets</text><text x="24" y="63" font-size="14">Read arrows in order. SECRET = plaintext; KEY = encryption key; cylinders = stored data.</text></g><g transform="translate(82.08724999999998,88)">
<style>

