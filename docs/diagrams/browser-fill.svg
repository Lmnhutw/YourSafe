<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 941.596 1569" width="941.596" height="1569" style="--border:#94a3b8;--bg:#ffffff;--fg:#1f2328;--line:#64748b;--accent:#0969da;--muted:#334155;background:var(--bg)"><title id="title">Approve and fill one selected password</title><desc id="desc">After discovery, the worker prepares eligible fields in the exact top-level document before requesting a password. The desktop snapshots the candidate and mutation version, obtains a single approval with a 60-second deadline, then rechecks origin, lifecycle and revision. Final pipe and browser checks guard disclosure and filling. No form is submitted.</desc><metadata>{&quot;source&quot;:&quot;browser-fill.mmd&quot;,&quot;sourceSha256&quot;:&quot;de0695a6a306ccc1e22fe0707c2b047e500ed267432e0b6dcea066f969ff28cf&quot;,&quot;renderer&quot;:&quot;beautiful-mermaid@1.1.3&quot;,&quot;theme&quot;:&quot;github-light&quot;,&quot;line&quot;:&quot;#64748b&quot;,&quot;muted&quot;:&quot;#334155&quot;,&quot;border&quot;:&quot;#94a3b8&quot;}</metadata><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a"><text x="24" y="34" font-size="24" font-weight="600">Approve and fill one selected password</text><text x="24" y="63" font-size="14">Read arrows in order. SECRET = plaintext; KEY = encryption key; cylinders = stored data.</text></g><g transform="translate(24,88)">
<style>

