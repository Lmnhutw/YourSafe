<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc">
<title id="title">Vault lock and login lifecycle</title><desc id="desc">For an enrolled vault, a successful Master Password and TOTP sign-in begins a fixed five-hour login. Table locking preserves metadata, Windows lifecycle locking clears it, and reopening during that login needs only the Master Password. Temporary desktop actions always relock; logout, login expiry or app exit ends login.</desc><metadata>{"source":"vault-lifecycle.mmd","sourceSha256":"1388609b5c8dda096453ffc3e65f6c8e3456a6b81e60cb506bea854d5163ced6","renderer":"Native editable SVG layout; same state transitions as Mermaid source","theme":"theme.json"}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}.arrow{fill:none;stroke:#64748b;stroke-width:1.8;stroke-linejoin:round}.transition{font-size:18px;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}.state{stroke-width:1.5;fill:#fffbeb;stroke:#d97706}.good{fill:#f0fdf4;stroke:#16a34a}.neutral{fill:#f8fafc;stroke:#64748b}.state-label{font-size:22px;font-weight:600}</style>
<rect width="1120" height="1100" fill="#fff"/>
<text x="24" y="36" font-size="26" font-weight="600">Vault lock and login lifecycle</text>
<text x="24" y="74" font-size="18" fill="#475569">Default vault duration: 1 minute. Activity and unlock never extend the five-hour login.</text>
<rect x="24" y="280" width="1000" height="780" rx="10" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 4"/>
<text x="48" y="314" font-size="20" font-weight="600">Active login - five-hour maximum</text>
<path d="M535 112 L535 140" class="arrow" marker-end="url(#arrow)"/><circle cx="535" cy="108" r="5" fill="#475569"/>
<path d="M535 205 L535 335" class="arrow" marker-end="url(#arrow)"/>
<text x="555" y="235" text-anchor="start" class="transition"><tspan x="555" dy="0">Master Password + TOTP</tspan><tspan x="555" dy="23">verified</tspan></text>
<path d="M420 163 L330 163 L330 235 L450 235 L450 205" class="arrow" marker-end="url(#arrow)"/>
<text x="338" y="262" text-anchor="middle" class="transition"><tspan x="338" dy="0">Invalid / cancel</tspan></text>
<path d="M1024 470 L1060 470 L1060 172 L650 172" class="arrow" marker-end="url(#arrow)"/>
<text x="852" y="128" text-anchor="middle" class="transition"><tspan x="852" dy="0">Logout / login expiry /</tspan><tspan x="852" dy="23">app exit</tspan></text>
<g><rect x="420" y="140" width="230" height="65" rx="7" class="state neutral"/><text x="535" y="180" text-anchor="middle" class="state-label">Signed out</text></g>
<path d="M385 400 L180 560" class="arrow" marker-end="url(#arrow)"/>
<text x="205" y="450" text-anchor="middle" class="transition"><tspan x="205" dy="0">Manual lock /</tspan><tspan x="205" dy="23">vault deadline</tspan></text>
<path d="M280 560 L485 400" class="arrow" marker-end="url(#arrow)"/>
<text x="446" y="475" text-anchor="middle" class="transition"><tspan x="446" dy="0">Unlock +</tspan><tspan x="446" dy="23">Master Password</tspan></text>
<path d="M580 370 L870 560" class="arrow" marker-end="url(#arrow)"/>
<text x="827" y="447" text-anchor="middle" class="transition"><tspan x="827" dy="0">Windows event</tspan></text>
<path d="M750 560 L550 400" class="arrow" marker-end="url(#arrow)"/>
<text x="653" y="501" text-anchor="middle" class="transition"><tspan x="653" dy="0">Master Password</tspan></text>
<path d="M310 592 L700 592" class="arrow" marker-end="url(#arrow)"/>
<text x="505" y="575" text-anchor="middle" class="transition"><tspan x="505" dy="0">Windows event</tspan></text>
<path d="M250 625 L500 820" class="arrow" marker-end="url(#arrow)"/>
<text x="425" y="707" text-anchor="middle" class="transition"><tspan x="425" dy="0">Action +</tspan><tspan x="425" dy="23">Master Password</tspan></text>
<path d="M370 852 L160 625" class="arrow" marker-end="url(#arrow)"/>
<text x="160" y="765" text-anchor="middle" class="transition"><tspan x="160" dy="0">Success / failure</tspan><tspan x="160" dy="23">- relock</tspan></text>
<path d="M610 850 L850 625" class="arrow" marker-end="url(#arrow)"/>
<text x="835" y="768" text-anchor="middle" class="transition"><tspan x="835" dy="0">Windows event</tspan></text>
<path d="M90 585 L40 585 L40 685 L140 685 L140 625" class="arrow" marker-end="url(#arrow)"/>
<text x="99" y="718" text-anchor="middle" class="transition"><tspan x="99" dy="0">Wrong password /</tspan><tspan x="99" dy="23">cancel</tspan></text>
<path d="M940 585 L990 585 L990 685 L900 685 L900 625" class="arrow" marker-end="url(#arrow)"/>
<text x="932" y="718" text-anchor="middle" class="transition"><tspan x="932" dy="0">Wrong password /</tspan><tspan x="932" dy="23">cancel</tspan></text>
<g><rect x="360" y="335" width="220" height="65" rx="7" class="state good"/><text x="470" y="375" text-anchor="middle" class="state-label">Unlocked</text></g>
<g><rect x="90" y="560" width="220" height="65" rx="7" class="state locked"/><text x="200" y="600" text-anchor="middle" class="state-label">Table locked</text></g>
<g><rect x="700" y="560" width="240" height="65" rx="7" class="state locked"/><text x="820" y="600" text-anchor="middle" class="state-label">Screen locked</text></g>
<g><rect x="370" y="820" width="240" height="65" rx="7" class="state locked"/><text x="490" y="860" text-anchor="middle" class="state-label">One desktop action</text></g>
<text x="110" y="938" font-size="18">Table lock: metadata stays visible; decrypted secrets and DEK are cleared.</text>
<text x="110" y="970" font-size="18">Screen lock: cached workspace metadata is also cleared.</text>
<text x="110" y="1002" font-size="18">Windows event: lock, disconnect, suspend or resume.</text>
</svg>
